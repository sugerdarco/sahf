# Default "fast version" config: 3 agents sharing one tokenizer (Qwen2.5
# family), sized to fit comfortably in 24GB VRAM. Bumped from 2 to 3 agents
# because Stage 7's robustness guarantee (breakdown point 1/2) needs an
# honest MAJORITY to mean anything -- that requires N >= 3. See HISTORY.md
# entry "N=3 by default" and ARCHITECTURE.md for the full reasoning.
models:
  - "Qwen/Qwen2.5-0.5B-Instruct"
  - "Qwen/Qwen2.5-1.5B-Instruct"
  - "Qwen/Qwen2.5-3B-Instruct"

device: "cuda"      # use "cpu" if no GPU is available (slow, but works for testing)
dtype: "bfloat16"    # use "float32" on CPU

max_new_tokens: 64
out_dir: "out"

gate:
  entropy_threshold: 2.0      # theta_H, nats — NOT calibrated yet, see HISTORY.md
  divergence_threshold: 0.05   # theta_D, on the amplitude/Hellinger scale
  mad_multiplier: 3.0           # outlier threshold, in median-absolute-deviations
